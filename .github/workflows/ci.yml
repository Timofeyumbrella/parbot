name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env && ln -sf ../../.env apps/web/.env
      # Runs `next typegen` first, so the generated route types exist on a fresh clone.
      - run: pnpm typecheck
      - run: pnpm widget:build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env:
          # Without the local stack the integration suites skip themselves; the next job runs them.
          SUPABASE_SERVICE_ROLE_KEY: ''
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

  integration:
    name: Integration and end-to-end tests against local Supabase
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # The version in pnpm-lock.yaml, so `db:types` output matches the committed file.
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      # Replays every migration and supabase/seed.sql (the demo account the chat spec signs in as).
      - run: supabase start -x studio,edge-runtime,logflare,vector,supavisor
      - name: Write the local keys into .env
        run: |
          eval "$(supabase status -o env)"
          cp .env.example .env
          sed -i \
            -e "s|^NEXT_PUBLIC_SUPABASE_URL=.*|NEXT_PUBLIC_SUPABASE_URL=${API_URL}|" \
            -e "s|^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*|NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}|" \
            -e "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}|" \
            -e "s|^AI_PROVIDER=.*|AI_PROVIDER=stub|" \
            .env
          ln -sf ../../.env apps/web/.env
      - name: Generated database types match the migrations
        run: pnpm db:types && git diff --exit-code apps/web/src/lib/db/types.ts
      # With the service role key present, the integration suites (engine, ingestion, billing
      # store, row level security) run instead of skipping.
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
        env:
          # A production server: no compile on a route's first visit, hydration right after load.
          E2E_WEB_SERVER: start
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
